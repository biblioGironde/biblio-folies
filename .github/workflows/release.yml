# Construit l'application de bureau (macOS, Windows, Linux) et publie une release
# à chaque ajout ou modification d'images, de textes, de pages ou du code de l'application.
name: Releases Electron

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "musique/**"
      - "programmes.json"
      - "*.html"
      - "lib/**"
      - "electron/**"
      - "package.json"
      - "build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  # 1. La release est créée en brouillon : invisible tant que tout n'est pas construit.
  preparer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer le brouillon v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Biblio-Folies $VERSION" \
            --notes "Mise à jour du $(date +%d/%m/%Y) — $(git log -1 --pretty=%s).

          Téléchargez le fichier correspondant à votre ordinateur :
          - **macOS** : \`.dmg\` (arm64 pour les Mac Apple Silicon, x64 pour les Mac Intel)
          - **Windows** : \`.exe\`
          - **Linux** : \`.AppImage\`

          Une fois installée, l'application récupère seule les nouvelles images et les nouveaux textes."

  # 2. Construction pour les trois systèmes, fichiers déposés dans le brouillon.
  construire:
    needs: preparer
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances (5 essais espacés en cas de coupure réseau)
        shell: bash
        run: |
          for essai in 1 2 3 4 5; do
            npm install && test -d node_modules/electron/dist && exit 0
            echo "Essai $essai échoué, nouvel essai dans $((essai * 60)) s"; rm -rf node_modules/electron; sleep $((essai * 60))
          done
          exit 1
      - run: npm pkg set version=${{ env.VERSION }}
      - run: node outils/manifeste.js
      - name: Construire et déposer dans le brouillon (5 essais espacés en cas de coupure réseau)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for essai in 1 2 3 4 5; do
            npx electron-builder --publish always && exit 0
            echo "Essai $essai échoué, nouvel essai dans $((essai * 60)) s"; sleep $((essai * 60))
          done
          exit 1

  # 3. Tout est construit : la release est publiée et devient la dernière version.
  #    Les anciennes releases incomplètes passent en préversion (rien n'est supprimé).
  publier:
    needs: construire
    runs-on: ubuntu-latest
    steps:
      - name: Publier v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false and (.assets | length) < 10) | .tag_name' |
          while read -r tag; do
            echo "Release incomplète passée en préversion : $tag"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease
          done

  # Construction échouée ou annulée : le brouillon est supprimé (il n'a jamais été visible).
  nettoyer:
    needs: construire
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer le brouillon v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes || true
