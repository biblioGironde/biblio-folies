# Publie le site sur GitHub Pages à chaque modification de la branche main.
# Le manifeste contenu.json est régénéré : l'application de bureau s'en sert
# pour récupérer les nouvelles images et les nouveaux textes.
name: Site GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Manifeste du contenu
        run: node outils/manifeste.js
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r *.html programmes.json contenu.json lib images audio _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
