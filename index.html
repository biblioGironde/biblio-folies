<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblio-Folies</title>
<meta name="description" content="Musée numérique des bibliothèques de Gironde : planches illustrées de Gallica (BnF) à projeter et à suivre sur smartphone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Accueil : un catalogue d'exposition. Thèmes en grandes capitales, chaque thématique
   présentée par sa planche d'ouverture, son titre en italique et deux actions. */
:root {
  --fond: #f2efe8; --carte: #fbfaf6; --encre: #1b1e1c; --doux: #5e625d; --filet: #d8d3c8;
  --or: #8a6a2a; --or-plein: #b08a3e; --sur-or: #ffffff; --ombre: 0 1px 2px rgba(27,30,28,.12), 0 10px 30px rgba(27,30,28,.08);
  --serif: "Cormorant Garamond", "Iowan Old Style", Garamond, Georgia, serif;
  --sans: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --fond: #121413; --carte: #1b1e1c; --encre: #ece8df; --doux: #a6a59e; --filet: #30342f; --or: #d4b46f; --or-plein: #c9a75c; --sur-or: #17140c; --ombre: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark; }
}
:root[data-theme="dark"] { --fond: #121413; --carte: #1b1e1c; --encre: #ece8df; --doux: #a6a59e; --filet: #30342f; --or: #d4b46f; --or-plein: #c9a75c; --sur-or: #17140c; --ombre: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 17px/1.6 var(--sans); }
img { max-width: 100%; }
a { color: var(--or); }
:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
.page { max-width: 1180px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

header.tete { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: baseline; justify-content: space-between; padding-block: 28px 18px; border-bottom: 1px solid var(--filet); }
.marque { font: italic 500 2rem/1 var(--serif); color: var(--encre); text-decoration: none; }
.marque span { font: 700 .7rem var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--doux); margin-left: 12px; font-style: normal; }
.liens { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .92rem; }
.liens a { color: var(--doux); text-decoration: none; }
.liens a:hover { color: var(--or); }

.ouverture { padding-block: 44px 16px; display: grid; gap: 12px; max-width: 64ch; }
.ouverture h1 { font: italic 500 clamp(2.4rem, 5.5vw, 4.2rem)/1.02 var(--serif); margin: 0; text-wrap: balance; }
.ouverture p { margin: 0; color: var(--doux); font-size: 1.05rem; }

.theme { padding-block: 34px 10px; display: grid; gap: 20px; }
.theme > h2 { font: 700 .78rem var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--or); margin: 0; display: flex; align-items: center; gap: 14px; }
.theme > h2::after { content: ""; flex: 1; height: 1px; background: var(--filet); }
.grille { display: grid; gap: 26px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }

.fiche { background: var(--carte); box-shadow: var(--ombre); display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.fiche .vignette { aspect-ratio: 4 / 3; overflow: hidden; background: var(--filet); display: block; }
.fiche .vignette img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; transition: transform .8s ease; }
@media (prefers-reduced-motion: no-preference) { .fiche:hover .vignette img { transform: scale(1.04); } }
.fiche .corps { padding: 20px 22px 22px; display: grid; gap: 10px; align-content: start; }
.fiche h3 { font: italic 500 1.75rem/1.08 var(--serif); margin: 0; text-wrap: balance; }
.fiche .sous { font: 600 1.08rem/1.3 var(--serif); color: var(--doux); margin: 0; }
.fiche .intro { margin: 0; font-size: .95rem; color: var(--doux); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.fiche .chiffres { font-size: .82rem; color: var(--doux); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.btn { font: 700 .9rem var(--sans); text-decoration: none; padding: 10px 16px; border-radius: 3px; border: 1px solid var(--encre); color: var(--encre); background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn.plein { background: var(--or-plein); border-color: var(--or-plein); color: var(--sur-or); }
.btn svg { width: 16px; height: 16px; fill: currentColor; }

/* Vue d'une thématique */
.retour { display: inline-block; margin-top: 26px; font-size: .92rem; color: var(--doux); text-decoration: none; }
.retour:hover { color: var(--or); }
.entete-prog { padding-block: 14px 26px; display: grid; gap: 12px; max-width: 70ch; }
.entete-prog .eyebrow { font: 700 .76rem var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--or); }
.entete-prog h1 { font: italic 500 clamp(2.2rem, 5vw, 3.6rem)/1.04 var(--serif); margin: 0; text-wrap: balance; }
.entete-prog .sous { font: 600 1.25rem var(--serif); color: var(--doux); margin: 0; }
.entete-prog p { margin: 0; }
.entete-prog .musique { font-size: .92rem; color: var(--doux); }
.entete-prog .musique i { font-family: var(--serif); font-size: 1.1rem; color: var(--encre); }
.planches { display: grid; gap: 40px; padding-bottom: 20px; }
.planche { display: grid; gap: 22px 36px; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; padding-top: 34px; border-top: 1px solid var(--filet); }
@media (max-width: 760px) { .planche { grid-template-columns: minmax(0, 1fr); } }
.planche figure { margin: 0; background: var(--carte); padding: 12px; box-shadow: var(--ombre); }
.planche figure img { display: block; width: 100%; height: auto; }
.planche .texte { display: grid; gap: 10px; min-width: 0; }
.planche .num { font: 700 .76rem var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--doux); font-variant-numeric: tabular-nums; }
.planche h2 { font: italic 500 1.9rem/1.1 var(--serif); margin: 0; }
.planche .leg { font: 600 1.2rem/1.3 var(--serif); margin: 0; }
.planche .meta { font-size: .88rem; color: var(--doux); margin: 0; }
.planche .recit { display: grid; gap: .8em; max-width: 62ch; }
.planche .recit p { margin: 0; }
.planche .gallica { font-size: .88rem; }

footer.pied { margin-top: 56px; padding-block: 26px 40px; border-top: 1px solid var(--filet); font-size: .84rem; color: var(--doux); display: grid; gap: 6px; }
.etat { padding-block: 60px; color: var(--doux); }
</style>
</head>
<body>
<div class="page">
  <header class="tete">
    <a class="marque" href="#">Biblio-Folies<span>biblio.gironde</span></a>
    <nav class="liens" aria-label="Liens">
      <a href="diaporama.html">Projection</a>
      <a href="https://github.com/biblioGironde/biblio-folies/releases/latest" id="lien-appli">Application à télécharger</a>
      <a href="https://github.com/biblioGironde/biblio-folies">Code source</a>
    </nav>
  </header>
  <main id="app"><p class="etat">Chargement des thématiques…</p></main>
  <footer class="pied">
    <span>Images : gallica.bnf.fr / Bibliothèque nationale de France. Réutilisation non commerciale avec mention de la source.</span>
    <span>Un projet du service biblio.gironde, Département de la Gironde.</span>
  </footer>
</div>

<script src="lib/musee.js"></script>
<script>
"use strict";
let data = null;
const app = document.getElementById("app");
const esc = Musee.esc;
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

// Dans l'application de bureau, le lien de téléchargement n'a pas d'intérêt.
if (navigator.userAgent.includes("Electron")) document.getElementById("lien-appli").hidden = true;

function dureeTotale(p) {
  const s = p.slides.reduce((a, x) => a + (x.duree || p.duree || data.dureeParDefaut || 45), 0);
  return s >= 60 ? `${Math.round(s / 60)} min` : `${s} s`;
}

function vueAccueil() {
  const themes = [];
  data.programmes.forEach(p => {
    let t = themes.find(x => x.nom === p.theme);
    if (!t) themes.push(t = { nom: p.theme || "Autres", progs: [] });
    t.progs.push(p);
  });
  app.innerHTML = `
    <section class="ouverture">
      <h1>Les plus belles planches des collections de Gallica</h1>
      <p>Choisissez une thématique : projetez-la en grand dans la bibliothèque, le public suit l'histoire de chaque planche sur son téléphone.</p>
    </section>
    ${themes.map(t => `
      <section class="theme">
        <h2>${esc(t.nom)}</h2>
        <div class="grille">
          ${t.progs.map(p => {
            const s0 = p.slides[0];
            return `<article class="fiche">
              <a class="vignette" href="#${esc(p.id)}" aria-label="Voir les planches : ${esc(p.titre)}">
                <img loading="lazy" alt="" src="${Musee.image(s0, ",900")}" data-secours="${Musee.image({ ...s0, image: null }, ",900")}">
              </a>
              <div class="corps">
                <h3>${esc(p.titre)}</h3>
                <p class="sous">${esc(p.sousTitre || "")}</p>
                <p class="intro">${esc(p.intro || "")}</p>
                <div class="chiffres">${p.slides.length} planches · ${dureeTotale(p)} de projection${p.audio && p.audio.src ? " · avec musique" : ""}</div>
                <div class="actions">
                  <a class="btn plein" href="diaporama.html#p=${encodeURIComponent(p.id)}">${ICON_PLAY}Lancer la projection</a>
                  <a class="btn" href="#${esc(p.id)}">Voir les planches</a>
                </div>
              </div>
            </article>`;
          }).join("")}
        </div>
      </section>`).join("")}`;
  secours();
}

function vueProgramme(p) {
  app.innerHTML = `
    <a class="retour" href="#">← Toutes les thématiques</a>
    <section class="entete-prog">
      <div class="eyebrow">${esc(p.theme || "")}</div>
      <h1>${esc(p.titre)}</h1>
      <p class="sous">${esc(p.sousTitre || "")}</p>
      <p>${esc(p.intro || "")}</p>
      ${p.audio && p.audio.src ? `<p class="musique">Musique : <i>${esc(p.audio.titre || "")}</i>${p.audio.credit ? " — " + esc(p.audio.credit) : ""}${p.audio.ark ? ` <a href="https://gallica.bnf.fr/ark:/12148/${esc(p.audio.ark)}" target="_blank" rel="noopener">écouter sur Gallica</a>` : ""}</p>` : ""}
      <div class="actions"><a class="btn plein" href="diaporama.html#p=${encodeURIComponent(p.id)}">${ICON_PLAY}Lancer la projection</a></div>
    </section>
    <div class="planches">
      ${p.slides.map((s, i) => `
        <article class="planche">
          <figure><img loading="lazy" alt="${esc(s.titre + ", " + (s.planche || ""))}" src="${Musee.image(s, ",1600")}" data-secours="${Musee.image({ ...s, image: null }, ",1600")}"></figure>
          <div class="texte">
            <div class="num">${String(i + 1).padStart(2, "0")} / ${String(p.slides.length).padStart(2, "0")}</div>
            <h2>${esc(s.planche || s.titre)}</h2>
            ${s.legende ? `<p class="leg">${esc(s.legende)}</p>` : ""}
            <p class="meta">${esc([s.titre, s.auteur, s.date].filter(Boolean).join(" · "))}</p>
            <div class="recit">${Musee.paragraphes(s.texte)}</div>
            <p class="meta">Source : gallica.bnf.fr / BnF${s.cote ? " — " + esc(s.cote) : ""} · <a class="gallica" href="${Musee.lienGallica(s)}" target="_blank" rel="noopener">voir sur Gallica</a></p>
          </div>
        </article>`).join("")}
    </div>`;
  secours();
  window.scrollTo(0, 0);
}

// Si une image locale manque, on la demande à Gallica.
function secours() {
  app.querySelectorAll("img[data-secours]").forEach(img => {
    img.addEventListener("error", () => { if (img.src !== img.dataset.secours) img.src = img.dataset.secours; }, { once: true });
  });
}

function route() {
  if (!data) return;
  const id = decodeURIComponent(location.hash.slice(1));
  const p = data.programmes.find(x => x.id === id);
  p ? vueProgramme(p) : vueAccueil();
}
window.addEventListener("hashchange", route);
Musee.charger().then(d => { data = d; route(); }).catch(() => {
  app.innerHTML = `<p class="etat">Les thématiques n'ont pas pu être chargées. Rechargez la page ; si vous l'ouvrez depuis votre ordinateur, lancez un petit serveur (python3 -m http.server).</p>`;
});
</script>
</body>
</html>
